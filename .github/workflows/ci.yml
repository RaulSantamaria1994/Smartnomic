name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Los tests del servidor se ejecutan contra PostgreSQL real (constitución, art. VII.4).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartnomic
          POSTGRES_PASSWORD: smartnomic
          POSTGRES_DB: smartnomic_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smartnomic" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://smartnomic:smartnomic@localhost:5432/smartnomic_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
